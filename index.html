<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wano Zoro - LG Remote Controls</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050817;color:#fff;font-family:Arial,sans-serif}
#scene{position:relative;width:100vw;height:100vh;display:grid;place-items:center}
#art{width:100%;height:100%;object-fit:contain;transition:filter .2s}
#eye{position:absolute;left:43.1%;top:38.2%;width:2.2vw;height:1.2vw;min-width:14px;min-height:8px;border-radius:50%;background:radial-gradient(ellipse,#e9ffff 0 22%,#40d7ff 28% 48%,#08202b 57% 70%,transparent 74%);box-shadow:0 0 12px #4deaff;transform:translate(-50%,-50%);transition:left .18s,top .18s;pointer-events:none;opacity:.9}
#flash{position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(90,255,70,.7),transparent 65%);opacity:0;pointer-events:none}
#flash.go{animation:slash .7s ease-out}@keyframes slash{0%{opacity:0;transform:translateX(-35%)}25%{opacity:1}100%{opacity:0;transform:translateX(35%)}}
#panel{position:absolute;right:3%;bottom:5%;width:min(31vw,330px);min-width:210px;padding:12px;background:#06101ddd;border:2px solid #d9f4ff;border-radius:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
button{min-height:48px;border:2px solid #9bd9ee;border-radius:12px;background:#14283a;color:white;font-size:clamp(14px,1.5vw,20px);font-weight:bold}
button:focus{outline:5px solid #ffe45c;outline-offset:2px;background:#087b9d;color:white}
#up{grid-column:2}#left{grid-column:1;grid-row:2}#center{grid-column:2;grid-row:2;background:#25374a}#right{grid-column:3;grid-row:2}#down{grid-column:2;grid-row:3}#action{grid-column:1/4;min-height:56px;background:#63331f;border-color:#ffc78b}
#status{position:absolute;left:2%;bottom:2%;padding:9px 12px;background:#000c;border:1px solid #ffffff77;border-radius:9px;font-size:clamp(12px,1.4vw,18px)}
#hint{position:absolute;left:2%;top:2%;max-width:70%;padding:9px 12px;background:#000b;border-radius:8px;font-size:clamp(12px,1.3vw,18px)}
body.action #art{filter:brightness(1.18) saturate(1.3)}
@media(max-width:700px){#panel{width:42vw;min-width:180px;right:2%;bottom:8%;padding:7px;gap:5px}button{min-height:40px}}
</style></head><body>
<div id="scene">
<img id="art" src="zoro-wano.jpg" alt="Wano Zoro">
<div id="eye"></div><div id="flash"></div>
<div id="hint">Use remote arrows to highlight a control, then press OK to activate it.</div>
<div id="status">WANO ZORO · READY</div>
<div id="panel" aria-label="Zoro controls">
<button id="up" type="button">↑ LOOK UP</button>
<button id="left" type="button">← LEFT</button>
<button id="center" type="button">RESET</button>
<button id="right" type="button">RIGHT →</button>
<button id="down" type="button">↓ LOOK DOWN</button>
<button id="action" type="button">⚔ SWORD ACTION</button>
</div></div>
<script>
(function(){
 const eye=document.getElementById('eye'),flash=document.getElementById('flash'),status=document.getElementById('status');
 let x=0,y=0;
 function render(){eye.style.left=(43.1+x*.55)+'%';eye.style.top=(38.2+y*.45)+'%';status.textContent='ZORO · GAZE UPDATED'}
 function move(dx,dy){x=Math.max(-12,Math.min(12,x+dx));y=Math.max(-7,Math.min(7,y+dy));render()}
 function reset(){x=0;y=0;render();status.textContent='GAZE RESET'}
 function slash(){document.body.classList.add('action');flash.classList.remove('go');void flash.offsetWidth;flash.classList.add('go');status.textContent='THREE SWORD STYLE!';setTimeout(()=>{document.body.classList.remove('action');status.textContent='WANO ZORO · READY'},850)}
 document.getElementById('up').addEventListener('click',()=>move(0,-3));
 document.getElementById('down').addEventListener('click',()=>move(0,3));
 document.getElementById('left').addEventListener('click',()=>move(-4,0));
 document.getElementById('right').addEventListener('click',()=>move(4,0));
 document.getElementById('center').addEventListener('click',reset);
 document.getElementById('action').addEventListener('click',slash);
 document.getElementById('up').focus();render();
})();
</script></body></html>
