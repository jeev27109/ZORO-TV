<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wano Zoro - Interactive TV Wallpaper</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050817;color:white;font-family:Arial,sans-serif}
#scene{position:relative;width:100vw;height:100vh;display:grid;place-items:center;background:#050817}
#art{width:100%;height:100%;object-fit:contain;transition:filter .25s,transform .25s}
#eye{position:absolute;left:43.1%;top:38.2%;width:2.2vw;height:1.2vw;min-width:14px;min-height:8px;border-radius:50%;background:radial-gradient(ellipse,#e9ffff 0 22%,#40d7ff 28% 48%,#08202b 57% 70%,transparent 74%);box-shadow:0 0 12px #4deaff;transform:translate(-50%,-50%);transition:left .16s,top .16s;pointer-events:none;opacity:.8}
#flash{position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(90,255,70,.65),transparent 65%);opacity:0;pointer-events:none}
#flash.go{animation:slash .75s ease-out}
@keyframes slash{0%{opacity:0;transform:translateX(-35%)}25%{opacity:1}100%{opacity:0;transform:translateX(35%)}}
#hint{position:absolute;left:2%;bottom:2%;padding:10px 14px;background:#0009;border:1px solid #ffffff55;border-radius:10px;font-size:clamp(12px,1.5vw,20px)}
#status{position:absolute;right:2%;bottom:2%;padding:10px 14px;background:#001a12cc;border:1px solid #64ff9a77;border-radius:10px;font-size:clamp(12px,1.5vw,20px)}
body.action #art{filter:brightness(1.18) saturate(1.3)}
@media(max-aspect-ratio:4/3){#art{object-fit:cover}#eye{left:43%;top:39%}}
</style>
</head>
<body>
<div id="scene">
<img id="art" src="zoro-wano.jpg" alt="Wano Zoro wallpaper">
<div id="eye"></div><div id="flash"></div>
<div id="hint">← ↑ ↓ → Move Zoro's gaze &nbsp; • &nbsp; OK: Sword action &nbsp; • &nbsp; Back: Reset</div>
<div id="status">WANO ZORO · IDLE</div>
</div>
<script>
(function(){
 const eye=document.getElementById('eye'), flash=document.getElementById('flash'), status=document.getElementById('status');
 let x=0,y=0,blinkTimer;
 function render(){eye.style.left=(43.1+x*0.55)+'%';eye.style.top=(38.2+y*0.45)+'%';status.textContent=(x||y)?'ZORO · LOOKING':'WANO ZORO · IDLE'}
 function action(){document.body.classList.add('action');flash.classList.remove('go');void flash.offsetWidth;flash.classList.add('go');status.textContent='THREE SWORD STYLE!';setTimeout(()=>{document.body.classList.remove('action');status.textContent='WANO ZORO · IDLE'},850)}
 function reset(){x=0;y=0;render()}
 document.addEventListener('keydown',e=>{
  const k=e.keyCode||e.which;
  if([37,38,39,40,13,461,8,27,10009].includes(k))e.preventDefault();
  if(k===37)x=Math.max(-12,x-4); else if(k===39)x=Math.min(12,x+4);
  else if(k===38)y=Math.max(-7,y-3); else if(k===40)y=Math.min(7,y+3);
  else if(k===13||k===23||k===32){action();return}
  else if(k===461||k===8||k===27||k===10009){reset();return}
  render();
 });
 // Subtle idle blink cue (the art remains unchanged; eye indicator briefly dims).
 function blink(){eye.style.opacity='.15';setTimeout(()=>eye.style.opacity='.8',180);blinkTimer=setTimeout(blink,4200+Math.random()*2600)}
 blinkTimer=setTimeout(blink,4200);
 document.addEventListener('visibilitychange',()=>{if(document.hidden)clearTimeout(blinkTimer);else blinkTimer=setTimeout(blink,2500)});
 render();
})();
</script>
</body></html>
