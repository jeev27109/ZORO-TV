<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wano Zoro</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050817;font-family:Arial}#scene{position:relative;width:100vw;height:100vh}#art{width:100%;height:100%;object-fit:contain;transition:filter .2s}#eye{position:absolute;left:43.1%;top:38.2%;width:2.2vw;height:1.2vw;min-width:14px;min-height:8px;border-radius:50%;background:radial-gradient(ellipse,#e9ffff 0 22%,#40d7ff 28% 48%,#08202b 57% 70%,transparent 74%);box-shadow:0 0 12px #4deaff;transform:translate(-50%,-50%);transition:left .18s,top .18s;pointer-events:none;opacity:.8}#flash{position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,#5fff70aa,transparent 65%);opacity:0;pointer-events:none}#flash.go{animation:slash .7s ease-out}@keyframes slash{0%{opacity:0;transform:translateX(-35%)}25%{opacity:1}100%{opacity:0;transform:translateX(35%)}}#pad{position:absolute;right:18%;top:57%;width:16%;height:32%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:3%;opacity:.02}button{border:0;border-radius:50%;background:white;color:black;font-size:1px;min-width:0;min-height:0}button:focus{outline:4px solid white;outline-offset:3px;opacity:1;background:#3bff88}#pad .up{grid-column:2;grid-row:1}.left{grid-column:1;grid-row:2}.right{grid-column:3;grid-row:2}.down{grid-column:2;grid-row:3}#action{position:absolute;right:18%;top:72%;width:15%;height:9%;opacity:.02}#status{position:absolute;left:2%;bottom:2%;padding:9px 12px;background:#000b;color:white;border:1px solid #ffffff55;border-radius:9px;font-size:clamp(12px,1.5vw,20px)}#hint{position:absolute;left:2%;top:2%;padding:8px 12px;background:#0009;color:white;border-radius:8px;font-size:clamp(11px,1.2vw,17px)}body.action #art{filter:brightness(1.18) saturate(1.3)}
</style></head><body><div id="scene"><img id="art" src="zoro-wano.jpg" alt="Wano Zoro"><div id="eye"></div><div id="flash"></div><div id="hint">Use remote arrows to focus a control, then press OK</div><div id="status">WANO ZORO · READY</div>
<div id="pad"><button class="up" data-move="up" aria-label="Look up">UP</button><button class="left" data-move="left" aria-label="Look left">LEFT</button><button class="right" data-move="right" aria-label="Look right">RIGHT</button><button class="down" data-move="down" aria-label="Look down">DOWN</button></div><button id="action" aria-label="Sword action">SWORD ACTION</button></div>
<script>(()=>{const eye=document.getElementById('eye'),flash=document.getElementById('flash'),status=document.getElementById('status');let x=0,y=0;function render(){eye.style.left=(43.1+x*.55)+'%';eye.style.top=(38.2+y*.45)+'%';status.textContent='ZORO · GAZE CONTROL'}function move(d){if(d==='left')x=Math.max(-12,x-4);if(d==='right')x=Math.min(12,x+4);if(d==='up')y=Math.max(-7,y-3);if(d==='down')y=Math.min(7,y+3);render()}function slash(){document.body.classList.add('action');flash.classList.remove('go');void flash.offsetWidth;flash.classList.add('go');status.textContent='THREE SWORD STYLE!';setTimeout(()=>{document.body.classList.remove('action');status.textContent='WANO ZORO · READY'},850)}document.querySelectorAll('[data-move]').forEach(b=>{b.addEventListener('click',()=>move(b.dataset.move));b.addEventListener('focus',()=>status.textContent='SELECTED · '+b.dataset.move.toUpperCase())});document.getElementById('action').addEventListener('click',slash);document.addEventListener('keydown',e=>{const k=e.keyCode||e.which;if([37,38,39,40,13,23,32,461,8,27,10009].includes(k))e.preventDefault();if(k===13||k===23||k===32){if(document.activeElement===document.body)slash();return}if(k===461||k===8||k===27||k===10009){x=0;y=0;render()}});document.querySelector('.up').focus();render()})();</script></body></html>
