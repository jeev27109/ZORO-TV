<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wano Zoro - LG TV Remote</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050817;color:#fff;font-family:Arial,sans-serif}
#scene{position:relative;width:100vw;height:100vh;display:grid;place-items:center}
#art{width:100%;height:100%;object-fit:contain;transition:filter .2s}
#eye{position:absolute;left:43.1%;top:38.2%;width:2.2vw;height:1.2vw;min-width:14px;min-height:8px;border-radius:50%;background:radial-gradient(ellipse,#e9ffff 0 22%,#40d7ff 28% 48%,#08202b 57% 70%,transparent 74%);box-shadow:0 0 12px #4deaff;transform:translate(-50%,-50%);transition:left .18s,top .18s;pointer-events:none;opacity:.85}
#flash{position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(90,255,70,.7),transparent 65%);opacity:0;pointer-events:none}
#flash.go{animation:slash .7s ease-out}@keyframes slash{0%{opacity:0;transform:translateX(-35%)}25%{opacity:1}100%{opacity:0;transform:translateX(35%)}}
#status{position:absolute;left:2%;bottom:2%;padding:9px 12px;background:#000b;border:1px solid #ffffff55;border-radius:9px;font-size:clamp(12px,1.5vw,20px)}
#hint{position:absolute;left:2%;top:2%;padding:8px 12px;background:#0009;border-radius:8px;font-size:clamp(11px,1.2vw,17px)}
body.action #art{filter:brightness(1.18) saturate(1.3)}
</style>
</head>
<body>
<div id="scene">
<img id="art" src="zoro-wano.jpg" alt="Wano Zoro">
<div id="eye"></div><div id="flash"></div>
<div id="hint">REMOTE: arrows = move eyes · OK/Enter = sword action</div>
<div id="status">WANO ZORO · READY</div>
</div>
<script>
(function(){
 const eye=document.getElementById('eye'), flash=document.getElementById('flash'), status=document.getElementById('status');
 let x=0,y=0,lastAction=0;
 function render(){
   eye.style.left=(43.1+x*.55)+'%';
   eye.style.top=(38.2+y*.45)+'%';
   status.textContent='ZORO · EYES MOVING';
 }
 function move(dx,dy){
   x=Math.max(-12,Math.min(12,x+dx));
   y=Math.max(-7,Math.min(7,y+dy));
   render();
 }
 function slash(){
   const now=Date.now(); if(now-lastAction<300)return; lastAction=now;
   document.body.classList.add('action');
   flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go');
   status.textContent='THREE SWORD STYLE!';
   setTimeout(()=>{document.body.classList.remove('action');status.textContent='WANO ZORO · READY'},850);
 }
 document.addEventListener('keydown',function(e){
   const k=e.keyCode||e.which, key=e.key||'';
   if(k===37||key==='ArrowLeft'){e.preventDefault();move(-4,0);return}
   if(k===39||key==='ArrowRight'){e.preventDefault();move(4,0);return}
   if(k===38||key==='ArrowUp'){e.preventDefault();move(0,-3);return}
   if(k===40||key==='ArrowDown'){e.preventDefault();move(0,3);return}
   if(k===13||k===23||k===32||key==='Enter'){e.preventDefault();slash();return}
   if(k===8||k===27||k===461||k===10009){e.preventDefault();x=0;y=0;render();status.textContent='GAZE RESET'}
 },true);
 document.addEventListener('click',slash);
 render();
})();
</script>
</body>
</html>
